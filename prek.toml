# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

default_stages = ["pre-commit"]
default_install_hook_types = [
  "pre-commit",
  "commit-msg"
  ]

[[repos]]
repo = "builtin"
hooks = [
  {
    id = "deny-pattern",
    name = "Check trailing whitespace",
    args = ['\s+$'],
    types = ["text"]
  },
  {
    id = "require-pattern",
    name = "Check final newline",
    args = [
      "--multiline",
      '\A\z|[^\r\n]\r?\n\z'
    ],
    types = ["text"]
  },
  {
    id = "check-json",
    exclude = '(^|/)tsconfig(\.[^/]+)?\.json$'
  },
  {
    id = "check-yaml",
    args = [
      "--allow-multiple-documents",
      "--disallow-unknown-tags"
    ]
  },
  { id = "check-toml" },
  { id = "check-added-large-files" }
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "frontend-check",
    name = "Check frontend",
    entry = "pnpm check:web",
    language = "system",
    pass_filenames = false,
    priority = 10,
    files = '^(src/|public/|index\.html$|(package|biome|tsconfig(\.[^/]+)?)\.json$|pnpm-(lock|workspace)\.yaml$|vite\.config\.[^/]+$|prek\.toml$|\.github/workflows/ci\.yml$)'
  },
  {
    id = "rust-check",
    name = "Check Rust",
    entry = "pnpm check:rust",
    language = "system",
    pass_filenames = false,
    priority = 10,
    files = '^(src-tauri/|\.cargo/|package\.json$|prek\.toml$|\.github/workflows/ci\.yml$)'
  },
  {
    id = "frontend-test",
    name = "Test frontend",
    entry = "pnpm test:web",
    language = "system",
    pass_filenames = false,
    priority = 20,
    files = '^(src/|public/|index\.html$|(package|biome|tsconfig(\.[^/]+)?)\.json$|pnpm-(lock|workspace)\.yaml$|vite\.config\.[^/]+$|prek\.toml$|\.github/workflows/ci\.yml$)'
  },
  {
    id = "rust-test",
    name = "Test Rust",
    entry = "pnpm test:rust",
    language = "system",
    pass_filenames = false,
    priority = 20,
    files = '^(src-tauri/|\.cargo/|package\.json$|prek\.toml$|\.github/workflows/ci\.yml$)'
  },
  {
    id = "commitlint",
    name = "Check commit message",
    entry = "pnpm exec commitlint --edit",
    language = "system",
    stages = ["commit-msg"]
  }
]
