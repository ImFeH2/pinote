pre-commit:
  fail_on_changes: always
  parallel: true
  jobs:
    - name: config
      run: pnpm format:config:check && pnpm check:config

    - name: web
      run: pnpm format:web:check && pnpm check:web && pnpm test:web

    - name: rust
      run: pnpm format:rust:check && pnpm check:rust && pnpm test:rust

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit "{1}"
