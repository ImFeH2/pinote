name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
          - name: Windows x64
            os: windows-latest
          - name: macOS arm64
            os: macos-15
          - name: macOS x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt,clippy
          rustflags: ""
          cache-workspaces: src-tauri -> target
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0
      - name: Check frontend
        run: pnpm check
      - name: Build frontend
        run: pnpm build
      - name: Check Rust formatting
        run: cargo fmt -- --check
        working-directory: src-tauri
      - name: Lint Rust
        run: cargo clippy -- -D warnings
        working-directory: src-tauri
      - name: Test Rust
        run: cargo test
        working-directory: src-tauri
      - name: Check release build
        run: cargo check --release
        working-directory: src-tauri
